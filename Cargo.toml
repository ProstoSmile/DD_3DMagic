[workspace]
members = ["crates/dd_core", "crates/dd_app", "crates/dd_mcp", "crates/dd_bridge"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
sha2 = "0.11"
